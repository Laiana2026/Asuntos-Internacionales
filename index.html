<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control y Registro</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --error-color: #e53e3e;
            --success-color: #38a169;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-color);
        }

        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .estado {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .estado.error {
            background-color: #fff5f5;
            color: var(--error-color);
            border: 1px solid #feb2b2;
        }

        .estado.cargando {
            background-color: #ebf8ff;
            color: var(--accent-color);
            border: 1px solid #bee3f8;
        }

        .estado.exito {
            background-color: #f0fff4;
            color: var(--success-color);
            border: 1px solid #c6f6d5;
        }

        #seccionFormulario {
            display: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SECCIÓN DE LOGIN -->
        <div id="seccionLogin">
            <h2>Acceso al Sistema</h2>
            <div class="form-group">
                <label for="usuarioLogin">Usuario:</label>
                <input type="text" id="usuarioLogin" placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="claveLogin">Contraseña:</label>
                <input type="password" id="claveLogin" placeholder="Ingrese su contraseña">
            </div>
            <button id="btnIngresar" onclick="iniciarSesion()">Ingresar</button>
            <div id="estadoLogin"></div>
        </div>

        <!-- SECCIÓN DE FORMULARIO PRINCIPAL -->
        <div id="seccionFormulario">
            <h2>Registro de Operaciones</h2>
            
            <div class="form-group">
                <label for="cedulaBuscar">Número de Cédula:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="cedulaBuscar" placeholder="Ingrese cédula a buscar">
                    <button type="button" onclick="buscarCedula()" style="width: 140px;">Buscar</button>
                </div>
            </div>

            <div class="info-grid">
                <div class="form-group">
                    <label>Grado:</label>
                    <input type="text" id="grado" readonly>
                </div>
                <div class="form-group">
                    <label>Nombres y Apellidos:</label>
                    <input type="text" id="nombres" readonly>
                </div>
            </div>

            <div class="info-grid">
                <div class="form-group">
                    <label>País:</label>
                    <input type="text" id="pais" readonly>
                </div>
                <div class="form-group">
                    <label>Agregaduría:</label>
                    <input type="text" id="agregaduria" readonly>
                </div>
            </div>

            <div class="form-group">
                <label>Cargo:</label>
                <input type="text" id="cargo" readonly>
            </div>

            <div class="info-grid">
                <div class="form-group">
                    <label>Teléfono Celular:</label>
                    <input type="text" id="telefonoCelular" readonly>
                </div>
                <div class="form-group">
                    <label>Correo Institucional:</label>
                    <input type="text" id="correoInstitucional" readonly>
                </div>
            </div>

            <div class="info-grid">
                <div class="form-group">
                    <label>Correo Agregaduría:</label>
                    <input type="text" id="correoAgregaduria" readonly>
                </div>
                <div class="form-group">
                    <label>Embajada / Institución:</label>
                    <input type="text" id="embajadaInstitucion" readonly>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

            <div class="form-group">
                <label for="horaIngreso">Hora de Ingreso:</label>
                <input type="time" id="horaIngreso">
            </div>

            <div class="form-group">
                <label for="horaSalida">Hora de Salida:</label>
                <input type="time" id="horaSalida">
            </div>

            <div class="form-group">
                <label for="observacion">Observación:</label>
                <textarea id="observacion" rows="3" placeholder="Detalles u observaciones..."></textarea>
            </div>

            <div class="form-group">
                <label for="archivoRespaldo">Archivo de Respaldo (Foto / PDF):</label>
                <input type="file" id="archivoRespaldo">
            </div>

            <button id="btnGuardar" onclick="guardarDatosSistema()">Guardar Registro</button>
            <div id="estadoFormulario"></div>
        </div>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbzS9uBi3ep_3Of16cPd6hNh4FMbmkklB0KqGOdoC5LG8GiwDCVF1Sz7XLw7cDRpqBVK/exec";

        async function llamarAPI(datos) {
            try {
                const response = await fetch(URL_API, {
                    method: "POST",
                    body: JSON.stringify(datos),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                return await response.json();
            } catch (error) {
                throw new Error("Error de red con el servidor: " + error.message);
            }
        }

        async function iniciarSesion() {
            const usuario = document.getElementById("usuarioLogin").value.trim();
            const clave = document.getElementById("claveLogin").value.trim();
            const btnIngresar = document.getElementById("btnIngresar");

            if (!usuario || !clave) {
                mostrarEstadoLogin("⚠️ Ingrese usuario y contraseña.", "error");
                return;
            }

            const ahora = new Date();
            const horas = ahora.getHours();
            const minutos = ahora.getMinutes();
            const horaMinDecimal = horas + (minutos / 60);
            const horaActualStr = String(horas).padStart(2, '0') + ":" + String(minutos).padStart(2, '0');

            const esHorarioValido = (horaMinDecimal >= 7.0 && horaMinDecimal <= 9.0) || (horaMinDecimal >= 17.0 && horaMinDecimal <= 22.0);

            if (!esHorarioValido) {
                mostrarEstadoLogin("⚠️ Acceso denegado. Las horas permitidas son de 07H00 a 10H00 o de 17H00 a 22H00. Hora actual en su país: " + horaActualStr, "error");
                btnIngresar.disabled = true;

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            
                            mostrarEstadoLogin("⚠️ Acceso denegado. Las horas permitidas son de 07H00 a 10H00 o de 17H00 a 22H00. Hora actual en su país: " + horaActualStr, "error");
                            llamarAPI({ accion: "notificarAccesoFueraDeHorario", usuario: usuario, hora: horaActualStr, lat: lat, lon: lon });
                            btnIngresar.disabled = false;
                        },
                        function(error) {
                            mostrarEstadoLogin("⚠️ Acceso denegado. (No se pudo obtener la ubicación GPS).", "error");
                            llamarAPI({ accion: "notificarAccesoFueraDeHorario", usuario: usuario, hora: horaActualStr, lat: null, lon: null });
                            btnIngresar.disabled = false;
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    llamarAPI({ accion: "notificarAccesoFueraDeHorario", usuario: usuario, hora: horaActualStr, lat: null, lon: null });
                    mostrarEstadoLogin("⚠️ Acceso denegado. Las horas permitidas son de 07H00 a 10H00 o de 17H00 a 22H00.", "error");
                    btnIngresar.disabled = false;
                }
                return;
            }

            btnIngresar.disabled = true;
            mostrarEstadoLogin("Validando credenciales...", "cargando");

            try {
                const res = await llamarAPI({ accion: "verificarLogin", usuario: usuario, clave: clave });
                if (res && res.exito) {
                    document.getElementById("seccionLogin").style.display = "none";
                    document.getElementById("seccionFormulario").style.display = "block";
                    mostrarEstadoLogin("", "estado");
                    btnIngresar.disabled = false;
                } else {
                    mostrarEstadoLogin(res ? res.mensaje : "Error de respuesta del servidor", "error");
                    btnIngresar.disabled = false;
                }
            } catch (err) {
                mostrarEstadoLogin("❌ Error de conexión: " + err.message, "error");
                btnIngresar.disabled = false;
            }
        }

        function mostrarEstadoLogin(mensaje, tipo) {
            const estado = document.getElementById("estadoLogin");
            estado.textContent = mensaje;
            estado.className = "estado " + tipo;
        }

        async function buscarCedula() {
            const cedula = document.getElementById("cedulaBuscar").value.trim();
            if (!cedula) {
                alert("Por favor ingrese un número de cédula.");
                return;
            }

            try {
                const res = await llamarAPI({ accion: "buscarCedula", cedula: cedula });
                if (res && res.encontrada) {
                    document.getElementById("grado").value = res.grado;
                    document.getElementById("nombres").value = res.nombres;
                    document.getElementById("pais").value = res.pais;
                    document.getElementById("agregaduria").value = res.agregaduria;
                    document.getElementById("cargo").value = res.cargo;
                    document.getElementById("telefonoCelular").value = res.telefonoCelular;
                    document.getElementById("correoInstitucional").value = res.correoInstitucional;
                    document.getElementById("correoAgregaduria").value = res.correoAgregaduria;
                    document.getElementById("embajadaInstitucion").value = res.embajadaInstitucion;
                } else {
                    alert(res.mensaje || "Cédula no encontrada.");
                }
            } catch (err) {
                alert("Error al buscar cédula: " + err.message);
            }
        }

        async function guardarDatosSistema() {
            const btnGuardar = document.getElementById("btnGuardar");
            const estadoForm = document.getElementById("estadoFormulario");
            
            const cedula = document.getElementById("cedulaBuscar").value.trim();
            if (!cedula) {
                alert("Debe buscar y cargar los datos de una cédula primero.");
                return;
            }

            btnGuardar.disabled = true;
            estadoForm.textContent = "Obteniendo ubicación GPS y enviando datos...";
            estadoForm.className = "estado cargando";

            const enviarInformacion = async (lat = "", lon = "", precision = "") => {
                let archivoData = null;
                const fileInput = document.getElementById("archivoRespaldo");

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = async function(e) {
                        const base64Content = e.target.result.split(',')[1];
                        archivoData = {
                            bytes: base64Content,
                            tipo: file.type,
                            nombre: file.name
                        };
                        await ejecutarGuardadoAPI(lat, lon, precision, archivoData);
                    };
                    reader.readAsDataURL(file);
                } else {
                    await ejecutarGuardadoAPI(lat, lon, precision, null);
                }
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => enviarInformacion(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                    () => enviarInformacion("", "", ""),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                enviarInformacion("", "", "");
            }
        }

        async function ejecutarGuardadoAPI(lat, lon, precision, archivo) {
            const datosPayload = {
                cedula: document.getElementById("cedulaBuscar").value,
                grado: document.getElementById("grado").value,
                nombres: document.getElementById("nombres").value,
                pais: document.getElementById("pais").value,
                agregaduria: document.getElementById("agregaduria").value,
                cargo: document.getElementById("cargo").value,
                telefonoCelular: document.getElementById("telefonoCelular").value,
                correoInstitucional: document.getElementById("correoInstitucional").value,
                correoAgregaduria: document.getElementById("correoAgregaduria").value,
                embajadaInstitucion: document.getElementById("embajadaInstitucion").value,
                horaIngreso: document.getElementById("horaIngreso").value,
                horaSalida: document.getElementById("horaSalida").value,
                observacion: document.getElementById("observacion").value,
                latitud: lat,
                longitud: lon,
                precision: precision,
                archivo: archivo
            };

            try {
                const res = await llamarAPI({ accion: "guardarDatos", datos: datosPayload });
                const estadoForm = document.getElementById("estadoFormulario");
                if (res && res.exito) {
                    estadoForm.textContent = "✅ " + res.mensaje;
                    estadoForm.className = "estado exito";
                    document.getElementById("observacion").value = "";
                    document.getElementById("archivoRespaldo").value = "";
                } else {
                    estadoForm.textContent = "❌ " + (res ? res.mensaje : "Error desconocido");
                    estadoForm.className = "estado error";
                }
            } catch (err) {
                const estadoForm = document.getElementById("estadoFormulario");
                estadoForm.textContent = "❌ Error de conexión: " + err.message;
                estadoForm.className = "estado error";
            } finally {
                document.getElementById("btnGuardar").disabled = false;
            }
        }
    </script>
</body>
</html>
